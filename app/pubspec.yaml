name: ledger
description: "Automatic expense ledger from bank and UPI SMS. 100% on-device."
# Never published to pub.dev.
publish_to: 'none'

# versionName+versionCode for the Android build.
version: 1.0.0+1

environment:
  sdk: ^3.13.3

# Version ranges are deliberately wide rather than pinned. `pubspec.lock` is
# committed, so builds are reproducible from the lock file; the ranges only
# decide what a deliberate `flutter pub upgrade` may pick up. Majors ARE
# pinned, because a major bump is an API break that would silently invalidate
# code written against these packages.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- local database -----------------------------------------------------
  # drift: typed SQLite. Chosen over a document store because the ledger is
  # relational and every screen is an aggregate query (spend by category, by
  # month, by merchant) that must run on tens of thousands of rows.
  drift: '>=2.20.0 <3.0.0'
  # Ships the SQLite binary inside the APK, so the app does not depend on the
  # system SQLite version of whatever Android build the phone is running.
  sqlite3_flutter_libs: '>=0.5.0 <1.0.0'
  # Opens the drift database at a path_provider location with sane defaults.
  drift_flutter: '>=0.1.0 <1.0.0'
  path_provider: ^2.1.0

  # --- state --------------------------------------------------------------
  flutter_riverpod: ^2.5.1

  # --- formatting ---------------------------------------------------------
  # Dates only. Currency is formatted by Money.format(), NOT by intl:
  # NumberFormat.currency does not do Indian lakh/crore grouping correctly and
  # takes a double, which is forbidden for money in this app.
  intl: ^0.20.2

  # --- small local state --------------------------------------------------
  # Onboarding flags, last-sync timestamps, the selected month. Never
  # transactions: those live in drift.
  shared_preferences: ^2.5.0

  # --- platform -----------------------------------------------------------
  # SMS read/receive permission prompts and their permanently-denied state.
  permission_handler: '>=11.3.0 <13.0.0'

  # --- network ------------------------------------------------------------
  # USED FOR EXACTLY ONE THING: RulesProvider.checkForUpdate() fetching a newer
  # rules pack from the config server. No user data is ever sent anywhere. The
  # app is fully functional with this dependency permanently failing, and must
  # stay that way.
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # drift code generation. Run: dart run build_runner build -d
  drift_dev: '>=2.20.0 <3.0.0'
  build_runner: '>=2.4.0 <3.0.0'

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # The rules pack is BUNDLED so the app parses SMS correctly on first launch
  # with no network, forever. The config server only ever supplies a newer
  # pack; it is never required.
  #
  # Flutter cannot reference assets outside the package root, and the source of
  # truth is ../rules/ at the repo root (shared with tools/validate_rules.dart
  # and the config server). The Compile phase therefore copies
  #   money-ledger/rules/*.json  ->  money-ledger/app/assets/rules/
  # before `flutter build`. Do not hand-edit the copies: edit ../rules/*.json,
  # re-run `dart tools/validate_rules.dart`, and let the copy step re-run.
  assets:
    - assets/rules/
